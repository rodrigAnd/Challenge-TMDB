name: Simple Quality Check

on:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  check-code:
    name: Verificação de Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar arquivos Kotlin
        run: |
          echo "📋 Arquivos Kotlin modificados:"
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.kt$' || echo "Nenhum arquivo Kotlin modificado"
          
      - name: Verificar sintaxe básica
        run: |
          echo "✅ Verificação básica concluída"
          echo "Para verificações completas, veja o workflow code-review.yml"

