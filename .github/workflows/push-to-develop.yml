name: Push to Develop - Validação Contínua

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  continuous-validation:
    name: Validação Contínua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Build do projeto
        run: ./gradlew clean build --no-daemon

      - name: Executar testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Gerar relatório de cobertura
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Verificar cobertura mínima
        run: |
          COVERAGE_FILE="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "⚠️ Arquivo de cobertura não encontrado, mas continuando..."
            exit 0
          fi
          
          sudo apt-get update && sudo apt-get install -y bc || true
          
          COVERAGE=$(grep -oP 'type="INSTRUCTION" missed="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          COVERED=$(grep -oP 'type="INSTRUCTION" missed="[0-9]+" covered="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          
          if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
            echo "⚠️ Não foi possível extrair dados de cobertura"
            exit 0
          fi
          
          TOTAL=$((COVERAGE + COVERED))
          PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERED / $TOTAL) * 100}")
          
          echo "📊 Cobertura atual: $PERCENTAGE%"
          
          if (( $(echo "$PERCENTAGE < 90" | bc -l 2>/dev/null || echo "0") )); then
            echo "⚠️ Cobertura abaixo de 90%, mas não bloqueando push para develop"
          fi

      - name: Executar KTLint Check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Executar Detekt
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Upload relatório de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

