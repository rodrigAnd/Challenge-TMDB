name: Merge to Master - Validação Final

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Validação rigorosa antes de merge em master
  strict-validation:
    name: Validação Rigorosa para Master
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que o PR vem de develop
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          if [ "$BASE_BRANCH" != "master" ]; then
            echo "❌ Este workflow só deve ser executado para PRs direcionados à branch master"
            exit 1
          fi
          
          if [ "$HEAD_BRANCH" != "develop" ]; then
            echo "❌ ERRO: Este PR não vem da branch develop!"
            echo "   A branch master só aceita merges da develop."
            echo "   Branch atual: $HEAD_BRANCH"
            echo "   Branch esperada: develop"
            exit 1
          fi
          
          echo "✅ Validação de branch OK - PR vem de develop"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Executar KTLint Check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Executar Detekt
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Build completo
        run: ./gradlew clean build --no-daemon

      - name: Executar todos os testes
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --no-daemon

      - name: Gerar relatório de cobertura completo
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Validar cobertura mínima de 90%
        id: coverage-check
        run: |
          COVERAGE_FILE="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Arquivo de cobertura não encontrado!"
            exit 1
          fi
          
          # Instala bc se não estiver disponível
          sudo apt-get update && sudo apt-get install -y bc || true
          
          COVERAGE=$(grep -oP 'type="INSTRUCTION" missed="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          COVERED=$(grep -oP 'type="INSTRUCTION" missed="[0-9]+" covered="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          
          if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
            echo "⚠️ Tentando método alternativo de extração..."
            COVERAGE=$(grep -o 'missed="[0-9]*"' "$COVERAGE_FILE" | head -1 | grep -o '[0-9]*')
            COVERED=$(grep -o 'covered="[0-9]*"' "$COVERAGE_FILE" | head -1 | grep -o '[0-9]*')
          fi
          
          if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
            echo "❌ Não foi possível extrair dados de cobertura do XML"
            cat "$COVERAGE_FILE" | head -50
            exit 1
          fi
          
          TOTAL=$((COVERAGE + COVERED))
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ Nenhuma instrução encontrada no relatório de cobertura"
            exit 1
          fi
          
          PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERED / $TOTAL) * 100}")
          
          echo "==========================================="
          echo "📊 Relatório de Cobertura de Testes"
          echo "==========================================="
          echo "Instruções cobertas: $COVERED de $TOTAL"
          echo "Cobertura: $PERCENTAGE%"
          echo "Meta mínima: 90%"
          echo "==========================================="
          
          echo "coverage_percentage=$PERCENTAGE" >> $GITHUB_OUTPUT
          
          if (( $(echo "$PERCENTAGE < 90" | bc -l 2>/dev/null || echo "1") )); then
            echo "❌ Cobertura abaixo do mínimo exigido (90%)"
            echo "::error::Cobertura de testes insuficiente: $PERCENTAGE% (mínimo: 90%)"
            exit 1
          else
            echo "✅ Cobertura acima do mínimo exigido!"
          fi

      - name: Code Review Final com CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: |
            kotlin
            java

      - name: Executar CodeQL
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Verificar aprovações do PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const approvedReviews = reviews.filter(r => r.state === 'APPROVED');
            const requestedChanges = reviews.filter(r => r.state === 'CHANGES_REQUESTED');

            if (requestedChanges.length > 0) {
              core.setFailed(`❌ Existem ${requestedChanges.length} solicitações de mudanças pendentes. Por favor, resolva antes de fazer merge.`);
            }

            if (approvedReviews.length === 0) {
              core.setFailed('❌ Este PR precisa de pelo menos uma aprovação antes de fazer merge em master.');
            } else {
              console.log(`✅ PR tem ${approvedReviews.length} aprovação(ões)`);
            }

      - name: Verificar status de checks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });

            const failedChecks = checks.check_runs.filter(c => 
              c.status === 'completed' && c.conclusion === 'failure'
            );

            if (failedChecks.length > 0) {
              core.setFailed(`❌ Existem ${failedChecks.length} checks falhando. Todos os checks devem passar antes do merge.`);
            } else {
              console.log('✅ Todos os checks estão passando');
            }

      - name: Upload relatório de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload relatório HTML de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-master
          path: app/build/reports/jacoco/jacocoTestReport/

      - name: Upload relatório Detekt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report-master
          path: app/build/reports/detekt/*.html
          retention-days: 7

      - name: Comentário final no PR
        uses: actions/github-script@v7
        if: success()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = '${{ steps.coverage-check.outputs.coverage_percentage }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ Validação para Master Concluída\n\n` +
                    `✅ Build completo: Sucesso\n` +
                    `✅ Testes: Todos passando\n` +
                    `✅ Cobertura de testes: ${coverage}% (mínimo: 90%)\n` +
                    `✅ CodeQL: Sem problemas críticos\n` +
                    `✅ Aprovações: Verificadas\n\n` +
                    `**Este PR está pronto para merge em master!** 🚀`
            });

