name: Code Quality

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  ktlint:
    name: KTLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KTLint check
        run: ./gradlew ktlintCheck --no-daemon --stacktrace
        continue-on-error: true

      - name: Run KTLint format check
        run: ./gradlew ktlintFormatCheck --no-daemon || true

  detekt:
    name: Detekt Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Detekt reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/*.html
          retention-days: 7
          if-no-files-found: ignore

  code-quality:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [ktlint, detekt]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.ktlint.result }}" == "failure" ] || [ "${{ needs.detekt.result }}" == "failure" ]; then
            echo "⚠️ Code quality checks found issues, but not blocking merge"
            exit 0
          fi
          echo "✅ All code quality checks passed!"
