name: Code Quality

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  ktlint:
    name: KTLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

