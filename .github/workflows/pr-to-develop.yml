name: PR to Develop - Validação e Code Review

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  code-review:
    name: 🤖 Code Review Bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analisar arquivos modificados
        uses: actions/github-script@v7
        id: review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const kotlinFiles = files.filter(file => 
              file.filename.endsWith('.kt') && 
              file.status !== 'removed' &&
              file.status !== 'deleted'
            );

            if (kotlinFiles.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ **Code Review**: Nenhum arquivo Kotlin modificado neste PR.'
              });
              return;
            }

            let reviewComments = [];
            let suggestions = [];
            let warnings = [];
            let errors = [];

            for (const file of kotlinFiles) {
              try {
                const { data: content } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.filename,
                  ref: context.payload.pull_request.head.sha,
                });

                const fileContent = Buffer.from(content.content, 'base64').toString();
                const lines = fileContent.split('\n');
                
                const fileIssues = [];

                // Verificar documentação KDoc
                const hasPublicClass = /^(public\s+)?(data\s+)?class\s+\w+/.test(fileContent);
                const hasPublicFunction = /^(public\s+)?fun\s+\w+/.test(fileContent);
                const hasKDoc = fileContent.includes('/**') || fileContent.includes('*');
                
                if ((hasPublicClass || hasPublicFunction) && !hasKDoc) {
                  fileIssues.push({
                    type: 'suggestion',
                    message: '💡 Considere adicionar documentação KDoc para classes e funções públicas'
                  });
                }

                // Verificar tratamento de erros em funções suspensas
                const suspendFunctions = fileContent.match(/suspend\s+fun\s+\w+/g);
                if (suspendFunctions) {
                  suspendFunctions.forEach(() => {
                    if (!fileContent.includes('Result<') && !fileContent.includes('try {') && !fileContent.includes('catch')) {
                      fileIssues.push({
                        type: 'warning',
                        message: '⚠️ Funções suspensas devem ter tratamento de erros adequado (Result<T> ou try-catch)'
                      });
                    }
                  });
                }

                // Verificar uso de Log sem companion object
                if (fileContent.includes('Log.') && !fileContent.includes('companion object')) {
                  fileIssues.push({
                    type: 'suggestion',
                    message: '💡 Considere mover a tag de Log para um companion object para melhor performance'
                  });
                }

                // Verificar imports não utilizados (básico)
                const imports = fileContent.match(/^import\s+.*$/gm) || [];
                const usedImports = imports.filter(imp => {
                  const importName = imp.split('.').pop().split(' ')[0];
                  return fileContent.split('\n').some(line => 
                    line.includes(importName) && !line.startsWith('import')
                  );
                });

                // Verificar nomenclatura
                const className = fileContent.match(/class\s+(\w+)/);
                if (className && !/^[A-Z]/.test(className[1])) {
                  fileIssues.push({
                    type: 'error',
                    message: `❌ Nome de classe deve começar com maiúscula: ${className[1]}`
                  });
                }

                // Verificar funções muito longas (mais de 50 linhas)
                lines.forEach((line, index) => {
                  if (line.trim().startsWith('fun ')) {
                    let functionLines = 0;
                    let braceCount = 0;
                    let inFunction = false;
                    
                    for (let i = index; i < lines.length; i++) {
                      const currentLine = lines[i];
                      braceCount += (currentLine.match(/{/g) || []).length;
                      braceCount -= (currentLine.match(/}/g) || []).length;
                      
                      if (braceCount > 0) inFunction = true;
                      if (inFunction) functionLines++;
                      if (inFunction && braceCount === 0) break;
                    }
                    
                    if (functionLines > 50) {
                      fileIssues.push({
                        type: 'warning',
                        message: `⚠️ Função muito longa (${functionLines} linhas). Considere dividir em funções menores.`
                      });
                    }
                  }
                });

                if (fileIssues.length > 0) {
                  const errorsList = fileIssues.filter(i => i.type === 'error').map(i => i.message);
                  const warningsList = fileIssues.filter(i => i.type === 'warning').map(i => i.message);
                  const suggestionsList = fileIssues.filter(i => i.type === 'suggestion').map(i => i.message);

                  errors.push(...errorsList);
                  warnings.push(...warningsList);
                  suggestions.push(...suggestionsList);

                  reviewComments.push({
                    path: file.filename,
                    errors: errorsList,
                    warnings: warningsList,
                    suggestions: suggestionsList
                  });
                }
              } catch (error) {
                console.log(`Erro ao analisar ${file.filename}: ${error.message}`);
              }
            }

            // Criar comentário no PR
            let commentBody = '## 🤖 Code Review Automatizado\n\n';
            
            if (reviewComments.length === 0) {
              commentBody += '✅ **Excelente trabalho!** Nenhum problema encontrado no código.\n\n';
              commentBody += '📊 **Estatísticas:**\n';
              commentBody += `- Arquivos Kotlin analisados: ${kotlinFiles.length}\n`;
              commentBody += '- Problemas encontrados: 0\n';
            } else {
              commentBody += `📊 **Estatísticas:**\n`;
              commentBody += `- Arquivos Kotlin analisados: ${kotlinFiles.length}\n`;
              commentBody += `- Arquivos com sugestões: ${reviewComments.length}\n`;
              commentBody += `- Erros: ${errors.length}\n`;
              commentBody += `- Avisos: ${warnings.length}\n`;
              commentBody += `- Sugestões: ${suggestions.length}\n\n`;

              commentBody += '---\n\n';

              reviewComments.forEach(comment => {
                commentBody += `### 📄 ${comment.path}\n\n`;
                
                if (comment.errors.length > 0) {
                  commentBody += '**❌ Erros:**\n';
                  comment.errors.forEach(err => {
                    commentBody += `- ${err}\n`;
                  });
                  commentBody += '\n';
                }

                if (comment.warnings.length > 0) {
                  commentBody += '**⚠️ Avisos:**\n';
                  comment.warnings.forEach(warn => {
                    commentBody += `- ${warn}\n`;
                  });
                  commentBody += '\n';
                }

                if (comment.suggestions.length > 0) {
                  commentBody += '**💡 Sugestões:**\n';
                  comment.suggestions.forEach(sugg => {
                    commentBody += `- ${sugg}\n`;
                  });
                  commentBody += '\n';
                }

                commentBody += '---\n\n';
              });

              commentBody += '> 💡 Este é um review automatizado. Por favor, revise as sugestões acima.\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            // Criar review com sugestões
            if (reviewComments.length > 0) {
              const reviewEvent = errors.length > 0 ? 'REQUEST_CHANGES' : 'COMMENT';
              
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: reviewEvent,
                body: `🤖 **Code Review Automatizado**\n\n` +
                      `Foram encontrados ${errors.length + warnings.length + suggestions.length} pontos de atenção.\n\n` +
                      `Por favor, revise os comentários acima.`
              });
            } else {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'APPROVE',
                body: '✅ **Code Review Automatizado**: Código aprovado! Nenhum problema encontrado.'
              });
            }

            core.setOutput('has_issues', reviewComments.length > 0);
            core.setOutput('errors_count', errors.length);
            core.setOutput('warnings_count', warnings.length);
            core.setOutput('suggestions_count', suggestions.length);

  build-and-test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Executar testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: Gerar relatório de cobertura
        run: ./gradlew jacocoTestReport --no-daemon || echo "⚠️ Relatório de cobertura não disponível"
        continue-on-error: true

      - name: Verificar cobertura mínima (90%)
        run: |
          COVERAGE_FILE="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "⚠️ Arquivo de cobertura não encontrado, pulando verificação"
            exit 0
          fi
          
          COVERAGE=$(grep -oP 'type="INSTRUCTION" missed="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          COVERED=$(grep -oP 'type="INSTRUCTION" missed="[0-9]+" covered="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          
          if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
            echo "⚠️ Não foi possível extrair dados de cobertura do XML"
            exit 0
          fi
          
          TOTAL=$((COVERAGE + COVERED))
          PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERED / $TOTAL) * 100}")
          
          echo "==========================================="
          echo "📊 Relatório de Cobertura de Testes"
          echo "==========================================="
          echo "Instruções cobertas: $COVERED de $TOTAL"
          echo "Cobertura: $PERCENTAGE%"
          echo "Meta mínima: 90%"
          echo "==========================================="
          
          if (( $(echo "$PERCENTAGE < 90" | bc -l 2>/dev/null || echo "0") )); then
            echo "❌ Cobertura abaixo do mínimo exigido (90%)"
            exit 1
          else
            echo "✅ Cobertura acima do mínimo exigido!"
          fi

      - name: Upload relatório de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload relatório HTML de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/

  quality-check:
    name: Validação de Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Executar KTLint Check
        run: ./gradlew ktlintCheck --no-daemon --stacktrace
        continue-on-error: true

      - name: Executar Detekt
        run: ./gradlew detekt --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload relatório Detekt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/*.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Verificar lint Android
        run: ./gradlew lintDebug --no-daemon || true

  approval-check:
    name: Verificar Aprovações
    runs-on: ubuntu-latest
    needs: [code-review, build-and-test, quality-check]
    steps:
      - name: Verificar status dos jobs
        run: |
          echo "✅ Todos os jobs de validação foram concluídos!"
          echo "📋 Próximos passos:"
          echo "   1. Aguarde a aprovação do code review"
          echo "   2. Certifique-se de que a cobertura de testes está acima de 90%"
          echo "   3. Resolva quaisquer problemas identificados pelo code review"
