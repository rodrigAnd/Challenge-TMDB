name: PR to Develop - Validação e Code Review

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # Job de Code Review Automatizado
  code-review:
    name: Code Review Automatizado
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Code Review Bot
        run: |
          npm install -g @githubnext/github-copilot-cli

      - name: Análise de Código com CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: |
            kotlin
            java

      - name: Executar CodeQL
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Code Review com GitHub Copilot
        id: code-review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const kotlinFiles = files.filter(file => 
              file.filename.endsWith('.kt') && 
              file.status !== 'removed'
            );

            if (kotlinFiles.length === 0) {
              console.log('Nenhum arquivo Kotlin modificado');
              return;
            }

            let reviewComments = [];
            let hasIssues = false;

            for (const file of kotlinFiles.slice(0, 10)) { // Limita a 10 arquivos
              try {
                const { data: content } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.filename,
                  ref: context.payload.pull_request.head.sha,
                });

                const fileContent = Buffer.from(content.content, 'base64').toString();
                
                // Análise básica de qualidade de código
                const issues = [];
                
                // Verifica documentação KDoc
                const hasKDoc = fileContent.includes('/**') || fileContent.includes('*');
                if (!hasKDoc && fileContent.includes('class ') || fileContent.includes('fun ')) {
                  issues.push({
                    line: 1,
                    body: '⚠️ **Code Review**: Este arquivo parece não ter documentação KDoc adequada. Considere adicionar documentação seguindo o padrão KDoc.'
                  });
                }

                // Verifica tratamento de erros
                if (fileContent.includes('suspend fun') && !fileContent.includes('Result<') && !fileContent.includes('try {')) {
                  issues.push({
                    line: 1,
                    body: '⚠️ **Code Review**: Funções suspensas devem ter tratamento de erros adequado. Considere usar Result<T> ou try-catch.'
                  });
                }

                // Verifica uso de Log
                if (fileContent.includes('Log.') && !fileContent.includes('companion object')) {
                  issues.push({
                    line: 1,
                    body: '💡 **Code Review**: Considere mover a tag de Log para um companion object para melhor performance.'
                  });
                }

                if (issues.length > 0) {
                  hasIssues = true;
                  reviewComments.push({
                    path: file.filename,
                    body: issues.map(i => i.body).join('\n\n'),
                    line: 1
                  });
                }
              } catch (error) {
                console.log(`Erro ao analisar ${file.filename}: ${error.message}`);
              }
            }

            if (reviewComments.length > 0) {
              // Cria comentário no PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 Code Review Automatizado\n\n` +
                      `Foram encontradas ${reviewComments.length} sugestões de melhoria:\n\n` +
                      reviewComments.map(c => `### ${c.path}\n${c.body}`).join('\n\n---\n\n') +
                      `\n\n> Este é um review automatizado. Por favor, revise as sugestões acima.`
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ **Code Review Automatizado**: Nenhum problema crítico encontrado!'
              });
            }

            core.setOutput('has_issues', hasIssues);

  # Job de Build e Testes
  build-and-test:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Executar testes unitários
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Gerar relatório de cobertura
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Verificar cobertura mínima (90%)
        run: |
          COVERAGE_FILE="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Arquivo de cobertura não encontrado!"
            exit 1
          fi
          
          COVERAGE=$(grep -oP 'type="INSTRUCTION" missed="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          COVERED=$(grep -oP 'type="INSTRUCTION" missed="[0-9]+" covered="\K[0-9]+' "$COVERAGE_FILE" | head -1)
          
          if [ -z "$COVERAGE" ] || [ -z "$COVERED" ]; then
            echo "⚠️ Não foi possível extrair dados de cobertura do XML"
            exit 0
          fi
          
          TOTAL=$((COVERAGE + COVERED))
          PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($COVERED / $TOTAL) * 100}")
          
          echo "==========================================="
          echo "📊 Relatório de Cobertura de Testes"
          echo "==========================================="
          echo "Instruções cobertas: $COVERED de $TOTAL"
          echo "Cobertura: $PERCENTAGE%"
          echo "Meta mínima: 90%"
          echo "==========================================="
          
          if (( $(echo "$PERCENTAGE < 90" | bc -l) )); then
            echo "❌ Cobertura abaixo do mínimo exigido (90%)"
            exit 1
          else
            echo "✅ Cobertura acima do mínimo exigido!"
          fi

      - name: Upload relatório de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload relatório HTML de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/

  # Job de Validação de Qualidade
  quality-check:
    name: Validação de Qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Executar KTLint Check
        run: ./gradlew ktlintCheck --no-daemon

      - name: Executar Detekt
        run: ./gradlew detekt --no-daemon
        continue-on-error: true

      - name: Upload relatório Detekt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/*.html
          retention-days: 7

      - name: Verificar lint Android
        run: ./gradlew lintDebug --no-daemon || true

  # Job de Aprovação Final
  approval-check:
    name: Verificar Aprovações
    runs-on: ubuntu-latest
    needs: [code-review, build-and-test, quality-check]
    steps:
      - name: Verificar status dos jobs
        run: |
          echo "✅ Todos os jobs de validação foram concluídos com sucesso!"
          echo "📋 Próximos passos:"
          echo "   1. Aguarde a aprovação do code review"
          echo "   2. Certifique-se de que a cobertura de testes está acima de 90%"
          echo "   3. Resolva quaisquer problemas identificados pelo code review"

